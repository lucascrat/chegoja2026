server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Headers de segurança ──────────────────────────────────────
    # Previne clickjacking (o admin não pode ser embutido em iframes)
    add_header X-Frame-Options "DENY" always;
    # Previne MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer policy — só envia origin para cross-origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS — força HTTPS por 1 ano (após confirmar que HTTPS está funcionando)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Permissions Policy — restringe recursos do navegador
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(self), fullscreen=(self)" always;

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo para assets com hash no nome
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Não cachear o index.html (sempre buscar a versão mais recente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
